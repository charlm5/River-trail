<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>body{margin:0;background:#17251e;color:white;font:16px system-ui;overflow:hidden}canvas{display:block}#hud{position:absolute;top:15px;left:15px;background:#14251caa;padding:12px;border-radius:10px}#pad{position:absolute;bottom:25px;width:100%;display:flex;justify-content:space-around}button{background:#233b31cc;color:white;border:1px solid #ffffff88;border-radius:15px;padding:20px 14px;touch-action:none;font-size:18px} </style></head><body><div id="hud">RIVER TRAIL 4×4<br><span id="stats">Loading 3D engine...</span></div><div id="pad"><button data-k="l">Left</button><button data-k="r">Right</button><button data-k="b">Brake</button><button data-k="a">Drive</button><button id="reset">Restart</button></div><script>window.addEventListener("error",function(e){document.getElementById("stats").textContent="Graphics error: "+e.message});</script><script type="module">
const T = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js').catch(e=>{document.querySelector('#stats').textContent='3D engine failed to load. Open in a full browser with internet access.';throw e});
const scene=new T.Scene();scene.background=new T.Color(0xb5cbd4);scene.fog=new T.FogExp2(0xb5cbd4,.009);const cam=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);const R=new T.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.toneMapping=T.ACESFilmicToneMapping;document.body.prepend(R.domElement);scene.add(new T.HemisphereLight(0xe1efff,0x65513b,2));const sun=new T.DirectionalLight(0xffe2b7,3);sun.position.set(-30,60,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-35,right:35,top:35,bottom:-35,far:150});scene.add(sun,sun.target);
const road=z=>Math.sin(z*.025)*7;const height=(x,z)=>.3*Math.sin(z*.25)+.15*Math.sin(x*2+z*.8)+Math.max(0,Math.abs(x-road(z))-4)*.12*Math.sin(z*.12);
let seed=42;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const geo=new T.PlaneGeometry(100,700,140,350);geo.rotateX(-Math.PI/2);geo.translate(0,0,300);let a=geo.attributes.position,colors=[];for(let i=0;i<a.count;i++){let x=a.getX(i),z=a.getZ(i);a.setY(i,height(x,z));let col=new T.Color(Math.abs(x-road(z))<4?0x9c7954:0x657244);col.multiplyScalar(.75+rand()*.4);colors.push(col.r,col.g,col.b)}geo.setAttribute('color',new T.Float32BufferAttribute(colors,3));geo.computeVertexNormals();let ground=new T.Mesh(geo,new T.MeshStandardMaterial({vertexColors:true,roughness:1}));ground.receiveShadow=true;scene.add(ground);
const mat=(c,r=.8,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m});const rockmat=mat(0x77746c),leaf=mat(0x35572b),bark=mat(0x59402b);function mesh(geo,m,x,y,z,parent=scene){let o=new T.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
for(let i=0;i<330;i++){let z=rand()*600,x=road(z)+(rand()<.5?-1:1)*(5+rand()*36),s=.3+rand()*1.4;let o=mesh(new T.DodecahedronGeometry(s,0),rockmat,x,height(x,z),z);o.scale.set(1.4,.7,1);o.rotation.y=rand()*6;if(i%3===0){mesh(new T.CylinderGeometry(.13,.25,3,6),bark,x,height(x,z)+1.5,z);for(let j=0;j<3;j++)mesh(new T.ConeGeometry(1.6-j*.35,2.6,7),leaf,x,height(x,z)+2.5+j*.8,z)}}
let water=mesh(new T.PlaneGeometry(13,650),new T.MeshPhysicalMaterial({color:0x497d85,roughness:.22,metalness:.25,transparent:true,opacity:.82}),22,.12,300);water.rotation.x=-Math.PI/2;
const truck=new T.Group();scene.add(truck);const red=mat(0xa81913,.25,.55),black=mat(0x16191a),glass=mat(0x263f4d,.12,.45),chrome=mat(0x9a9da0,.25,.8);function box(w,h,d,m,x,y,z){return mesh(new T.BoxGeometry(w,h,d),m,x,y,z,truck)}box(2.1,.65,4.6,red,0,.85,0);box(2,1.05,2.1,red,0,1.65,.55);box(1.85,.65,.04,glass,0,1.8,1.62);box(1.85,.65,.04,glass,0,1.8,-.52);for(let s of [-1,1]){box(.04,.65,1.6,glass,s*1.01,1.8,.55);box(.15,.5,1.8,red,s*.94,1.23,-1.35);box(.35,.25,.08,mat(0xff3020),s*.8,.95,-2.34)}box(1.9,.15,1.65,black,0,1.13,-1.35);box(2.15,.22,.18,chrome,0,.65,-2.35);box(2.15,.22,.18,chrome,0,.65,2.35);let wheels=[];for(let s of [-1,1])for(let z of [-1.45,1.45]){let pivot=new T.Group();pivot.position.set(s*1.05,.5,z);truck.add(pivot);let w=mesh(new T.CylinderGeometry(.53,.53,.38,24),black,0,0,0,pivot);w.rotation.z=Math.PI/2;let hub=mesh(new T.CylinderGeometry(.29,.29,.4,16),chrome,0,0,0,pivot);hub.rotation.z=Math.PI/2;wheels.push(pivot)}
let k={},x=0,z=0,v=0,heading=0,damage=0;document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);k[b.dataset.k]=true};b.onpointerup=b.onpointercancel=()=>k[b.dataset.k]=false});let map={ArrowUp:'a',ArrowDown:'b',ArrowLeft:'l',ArrowRight:'r'};onkeydown=e=>k[map[e.key]]=true;onkeyup=e=>k[map[e.key]]=false;document.querySelector('#reset').onclick=()=>{x=z=v=heading=damage=0};let last=performance.now();function loop(t){requestAnimationFrame(loop);let dt=Math.min(.04,(t-last)/1000);last=t;if(z<550&&damage<100){let off=Math.abs(x-road(z))>4;v=Math.max(0,Math.min(off?9:23,v+dt*(k.a?6:k.b?-15:-1.8)));heading+=dt*((k.l?1:0)-(k.r?1:0))*Math.min(v/4,1)*1.1;heading*=Math.pow(.85,dt);x+=Math.sin(heading)*v*dt;z+=Math.cos(heading)*v*dt;if(off&&v>6)damage+=dt*.8;x=Math.max(-45,Math.min(45,x))}else v=0;truck.position.set(x,height(x,z)+.07,z);truck.rotation.set((height(x,z-1)-height(x,z+1))*.4,heading,(height(x+1,z)-height(x-1,z))*.4);wheels.forEach(w=>w.rotation.x+=v*dt/.53);let target=new T.Vector3(x-Math.sin(heading)*9,truck.position.y+5,z-Math.cos(heading)*9);cam.position.lerp(target,.09);cam.lookAt(x,truck.position.y+1,z+4);sun.position.set(x-30,60,z+25);sun.target.position.set(x,0,z);document.querySelector('#stats').textContent=z>=550?'Trail complete!':damage>=100?'Truck damaged — restart':`${Math.round(v*3.6)} km/h | ${Math.round(z)}/550 m | Damage ${Math.floor(damage)}%`;R.render(scene,cam)}cam.position.set(0,5,-9);requestAnimationFrame(loop);onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)};
</script></body></html>
